name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate sound library and Python files
        shell: pwsh
        run: |
          python -m compileall -q app run.py tools
          python -m unittest discover -s tests -v

      - name: Build KaoruInk.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name KaoruInk `
            --icon "assets/icon.ico" `
            --add-data "assets/sounds;assets/sounds" `
            --add-data "assets/icon.ico;assets" `
            --add-data "assets/icon.png;assets" `
            --hidden-import "pynput.keyboard._win32" `
            --hidden-import "pynput.mouse._win32" `
            --collect-all sounddevice `
            --collect-all _sounddevice_data `
            run.py
          if (!(Test-Path dist/KaoruInk.exe)) { throw 'Missing EXE' }
          (Get-FileHash dist/KaoruInk.exe -Algorithm SHA256).Hash.ToLower() + '  KaoruInk.exe' | Set-Content dist/SHA256SUMS.txt

      - name: Upload downloadable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: KaoruInk-Windows
          path: |
            dist/KaoruInk.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/KaoruInk.exe
            dist/SHA256SUMS.txt
